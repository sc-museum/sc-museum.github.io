<!doctype html><html><body><pre id="out">pending</pre><script>
const R='auditorium camp-gordon command-gallery hello-girls combat-camera fireside donor-spotlight people give timeline news magazine civil-war satellites weather fort-gordon wireless wired codes desert-storm'.split(' ');
Promise.all(R.map(r=>new Promise(res=>{const i=new Image();i.onload=()=>{const c=document.createElement('canvas');c.width=480;c.height=270;const g=c.getContext('2d');g.imageSmoothingQuality='high';g.drawImage(i,0,0,480,270);res(r+'='+c.toDataURL('image/jpeg',.8));};i.src='out/'+r+'.jpg';}))).then(a=>document.getElementById('out').textContent=a.join('\n'));
</script></body></html>
